name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # сборке нужен валидный env; секреты не требуются — внешних вызовов при билде нет
          ECASH_API_BASE_URL: https://api-dev.quiq.kz
          ECASH_CLIENT_ID: ci
          ECASH_CLIENT_SECRET: ci
          SESSION_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          APP_ORIGIN: http://localhost:3000
